<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTSK PMS v4 — 鉄骨工事プロジェクト管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--bg2:#f8f9fb;--bg3:#eef1f6;--border:#dfe3ea;--accent:#2563eb;--text:#1e293b;--muted:#64748b;--today:#dc2626;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--c1:#2563eb;--c2:#d97706;--c3:#16a34a;--c4:#7c3aed;--radius:8px}
body{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:15px;line-height:1.5}

/* HEADER */
.hdr{background:#ffffff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.logo{font-size:22px;font-weight:800;color:var(--accent)}.logo span{color:var(--warn)}
.tag{font-size:13px;color:var(--muted)}.sp{flex:1}
.hdr-r{text-align:right;font-size:13px;color:var(--muted)}

/* TABS */
.tabs{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;flex-shrink:0}
.tab{padding:12px 24px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;font-family:inherit;border-bottom:2px solid transparent;transition:all .2s;font-weight:500}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.tab:hover:not(.on){color:var(--text)}

.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ═══ INPUT PAGE ═══ */
#pgInput{flex:1;display:flex;overflow:hidden}
.ip-left{width:360px;min-width:360px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.ip-left-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ip-left-hdr span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;transition:background .15s}.btn:hover{background:#1d4ed8}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn-red{background:var(--danger)}.btn-red:hover{background:#b91c1c}
.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--accent);border-color:var(--accent)}

/* Project tree */
.ptree{flex:1;overflow-y:auto;padding:8px}
.pt-proj{margin-bottom:4px}
.pt-row{padding:10px 14px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:all .12s;font-size:14px}
.pt-row:hover{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pt-row.sel{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.pt-id{font-size:12px;color:var(--muted);font-weight:700;width:60px;flex-shrink:0}
.pt-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pt-st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px}
.st-ok{background:#dcfce7;color:var(--ok)}
.st-risk{background:#fef2f2;color:var(--danger)}
.st-na{background:var(--bg3);color:var(--muted)}
.pt-sub{padding-left:24px}
.pt-sub .pt-row{font-size:13px;padding:8px 14px}
.pt-sub .pt-id{width:20px;color:var(--accent);font-size:12px}

/* Right form */
.ip-right{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.form-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:16px}
.form-hdr{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.form-hdr .pt-st{font-size:12px}

.sec{margin-bottom:24px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:500}
.f input{background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:15px;font-family:inherit;transition:border .15s}
.f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.f input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer}
.f-full{grid-column:1/-1}
.f .unit{font-size:13px;color:var(--muted);margin-left:4px}
.f-inline{flex-direction:row;align-items:center;gap:10px}
.f-inline input{width:90px}

.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-top:12px}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.info-row .lbl{color:var(--muted)}.info-row .val{font-weight:700}
.info-row.warn .val{color:var(--danger)}
.info-row.ok .val{color:var(--ok)}
.status-big{font-size:16px;font-weight:800;padding:10px 16px;border-radius:var(--radius);text-align:center;margin-top:10px}
.status-big.ok{background:#dcfce7;color:var(--ok);border:1px solid #bbf7d0}
.status-big.risk{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}

.dtag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;color:#fff;font-weight:600}
.d1{background:var(--c1)}.d2{background:var(--c2)}.d3{background:var(--c3)}.d4{background:var(--c4)}

/* Sub-project list inside form */
.sp-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sp-row{padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;border:1px solid transparent;transition:all .12s}
.sp-row:hover{background:var(--bg2);border-color:var(--border)}.sp-row.sel{background:#eff6ff;border-color:var(--accent)}
.sp-dot{width:8px;height:8px;border-radius:50%}
.sp-btns{display:flex;gap:6px;margin-bottom:12px}

.form-actions{display:flex;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.form-actions .btn{padding:10px 24px;font-size:15px}

/* ═══ GANTT PAGE ═══ */
#pgGantt{flex:1;display:none;flex-direction:column;overflow:hidden}
#pgGantt.on{display:flex}
.gt{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.gt label{font-size:14px;color:var(--muted);font-weight:500}
.gt select{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.gt .zi{font-size:13px;color:var(--muted);margin-left:auto}
/* Split-pane Gantt layout */
.g-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.g-sidebar{width:240px;min-width:240px;overflow:hidden;background:var(--bg);border-right:2px solid var(--border);z-index:2;flex-shrink:0}
.g-sidebar canvas{display:block}
.g-timeline{flex:1;overflow:auto;background:var(--bg)}
.g-timeline canvas{display:block;cursor:default}
.gl{padding:8px 20px;display:flex;gap:16px;align-items:center;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}.lsw{width:14px;height:10px;border-radius:2px}
.ldiv{width:1px;height:14px;background:var(--border)}
.ltdy{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--today)}.ltl{width:14px;height:2px;background:var(--today);border-radius:1px}
.g-zoom-hint{position:absolute;bottom:60px;right:20px;background:rgba(30,41,59,.85);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:10}

/* ═══ WORKLOAD PAGE ═══ */
#pgWork{flex:1;display:none;overflow-y:auto;padding:28px 32px}
#pgWork.on{display:block}
.wh{margin-bottom:24px}.wt{font-size:22px;font-weight:700}.ws2{font-size:14px;color:var(--muted);margin-top:6px}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.sc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;border-top:3px solid;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sc .sl{font-size:13px;color:var(--muted)}.sc .sv{font-size:26px;font-weight:800;margin-top:6px}.sc .ss{font-size:12px;color:var(--muted);margin-top:4px}
.wc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.wc h3{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.wt2{width:100%;border-collapse:collapse;font-size:14px}
.wt2 th{text-align:left;padding:8px 12px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:700;font-size:13px}
.wt2 td{padding:8px 12px;border-bottom:1px solid var(--border)}.wt2 tr:last-child td{border-bottom:none}
.wt2 tr:hover td{background:var(--bg2)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#fff}

/* ═══ TASK PAGE ═══ */
#pgTask{flex:1;display:none;flex-direction:column;overflow:hidden}
#pgTask.on{display:flex}
.tk-bar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.tk-bar label{font-size:14px;color:var(--muted);font-weight:500}
.tk-bar select,.tk-bar input[type="date"]{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;font-size:14px;font-family:inherit}
.tk-body{flex:1;display:flex;overflow:hidden}
.tk-form{width:360px;min-width:360px;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto;padding:20px;display:none;flex-shrink:0}
.tk-form.open{display:block}
.tk-form .f{margin-bottom:14px}
.tk-form .f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.tk-form .f select,.tk-form .f input{width:100%;background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit}
.tk-form .f select:focus,.tk-form .f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.tk-scroll{flex:1;overflow:auto;background:var(--bg)}
canvas#tkCv{display:block;cursor:default}

/* Task settings modal */
.tk-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center}
.tk-modal-box{background:#fff;border-radius:12px;width:580px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.tk-modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:700}
.tk-modal-hdr button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px}
.tk-modal-hdr button:hover{color:var(--text)}
.tk-mtabs{display:flex;border-bottom:1px solid var(--border)}
.tk-mtab{flex:1;padding:10px;text-align:center;background:var(--bg2);color:var(--muted);border:none;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:all .2s}
.tk-mtab.on{background:#fff;color:var(--accent);border-bottom:2px solid var(--accent)}
.tk-modal-body{padding:20px;overflow-y:auto;flex:1}
.tk-set-list{display:flex;flex-direction:column;gap:6px}
.tk-set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-radius:6px;font-size:14px}
.tk-set-row select{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ═══ AUTH LAYER ═══ */
#authScreen{position:fixed;inset:0;background:linear-gradient(135deg,#f8fafc,#e2e8f0);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#authScreen.hidden{display:none}
#appShell{display:none;flex-direction:column;height:100vh}
#appShell.visible{display:flex}
.auth-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:400px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .logo{font-size:30px;font-weight:800;color:var(--accent);display:inline}.auth-logo .logo span{color:var(--warn)}
.auth-logo p{font-size:13px;color:var(--muted);margin-top:6px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.auth-tab{flex:1;padding:10px;text-align:center;background:var(--bg2);color:var(--muted);border:none;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:all .2s}
.auth-tab.on{background:var(--accent);color:#fff}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.auth-field input{width:100%;background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
.auth-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.auth-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s}
.auth-btn:hover{background:#1d4ed8}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-msg{margin-top:14px;padding:10px 14px;border-radius:6px;font-size:13px;display:none}
.auth-msg.err{display:block;background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.auth-msg.ok{display:block;background:#dcfce7;color:var(--ok);border:1px solid #bbf7d0}
.auth-footer{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}
.logout-btn{background:#fff;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.logout-btn:hover{border-color:var(--danger);color:var(--danger);background:#fef2f2}
.user-pill{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.user-dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
</style>
</head>
<body>

<!-- ═══ AUTH SCREEN (shown first) ═══ -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo">TTSK <span>PMS</span></div>
      <p>鉄骨工事 プロジェクト管理システム v4.0</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab on" onclick="switchAuthTab('login')">ログイン</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">新規登録</button>
    </div>
    <form id="authForm" onsubmit="return handleAuth(event)">
      <div class="auth-field" id="nameField" style="display:none">
        <label>表示名 (Display Name)</label>
        <input type="text" id="authName" placeholder="山田太郎" autocomplete="name">
      </div>
      <div class="auth-field">
        <label>メールアドレス (Email)</label>
        <input type="email" id="authEmail" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label>パスワード (Password)</label>
        <input type="password" id="authPass" placeholder="6文字以上" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn" id="authSubmit">ログイン</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>
    <div class="auth-footer">Powered by Supabase Auth</div>
  </div>
</div>

<!-- ═══ APP SHELL (hidden until logged in) ═══ -->
<div id="appShell">

<div class="hdr">
  <div class="logo">TTSK <span>PMS</span></div>
  <div class="tag">鉄骨工事 プロジェクト管理システム v4.0</div>
  <div class="sp"></div>
  <div class="user-pill" id="userPill">
    <span class="user-dot"></span>
    <span id="userName">—</span>
    <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
  </div>
  <div class="hdr-r" id="hdrInfo"></div>
</div>

<div class="tabs">
  <button class="tab on" onclick="showPage('input',this)">📋 プロジェクト管理</button>
  <button class="tab" onclick="showPage('gantt',this)">📊 ガントチャート</button>
  <button class="tab" onclick="showPage('work',this)">📈 工数分析</button>
  <button class="tab" onclick="showPage('task',this)">📝 タスク管理</button>
</div>

<div class="main">
  <!-- ═══ INPUT PAGE ═══ -->
  <div id="pgInput">
    <div class="ip-left">
      <div class="ip-left-hdr">
        <span>プロジェクト一覧</span>
        <button class="btn btn-sm" onclick="addProj().catch(e=>console.error('[PMS] addProj failed:',e))">＋ 新規PJ</button>
      </div>
      <div class="ptree" id="ptree"></div>
    </div>
    <div class="ip-right" id="ipRight">
      <div class="form-empty">← プロジェクトを選択してください</div>
    </div>
  </div>

  <!-- ═══ GANTT PAGE ═══ -->
  <div id="pgGantt">
    <div class="gt">
      <label>表示期間:</label>
      <input type="date" id="gStart" onchange="renderGantt()" style="background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;font-size:14px;font-family:inherit">
      <span style="color:var(--muted)">〜</span>
      <input type="date" id="gEnd" onchange="renderGantt()" style="background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;font-size:14px;font-family:inherit">
      <button class="btn btn-sm btn-ghost" onclick="gSetRange('month')">1ヶ月</button>
      <button class="btn btn-sm btn-ghost" onclick="gSetRange('quarter')">3ヶ月</button>
      <button class="btn btn-sm btn-ghost" onclick="gSetRange('half')">6ヶ月</button>
      <button class="btn btn-sm btn-ghost" onclick="gSetRange('auto')">自動</button>
      <div style="width:1px;height:20px;background:var(--border);margin:0 6px"></div>
      <label>ズーム:</label>
      <button class="btn btn-sm btn-ghost" onclick="gZoom(-5)" title="ズームアウト">−</button>
      <span class="zi" id="zInfo" style="min-width:80px;text-align:center"></span>
      <button class="btn btn-sm btn-ghost" onclick="gZoom(5)" title="ズームイン">＋</button>
      <span style="font-size:11px;color:var(--muted);margin-left:4px">Ctrl+Scroll</span>
    </div>
    <div class="g-wrap">
      <div class="g-sidebar" id="gSidebar"><canvas id="gcSide"></canvas></div>
      <div class="g-timeline" id="gScroll"><canvas id="gc"></canvas></div>
      <div class="g-zoom-hint" id="gZoomHint">Ctrl + Scroll でズーム</div>
    </div>
    <div class="gl">
      <div class="li"><div class="lsw" style="background:var(--c1)"></div>設計部</div><div class="ldiv"></div>
      <div class="li"><div class="lsw" style="background:var(--c2)"></div>調達部</div><div class="ldiv"></div>
      <div class="li"><div class="lsw" style="background:var(--c3)"></div>工場</div><div class="ldiv"></div>
      <div class="li"><div class="lsw" style="background:var(--c4)"></div>工事部</div><div class="ldiv"></div>
      <div class="li" style="color:#f59e0b">▨ オーバーラップ</div><div class="ldiv"></div>
      <div class="li" style="color:var(--ok)">✅ 正常</div>
      <div class="li" style="color:var(--danger)">⚠ リスク</div><div class="ldiv"></div>
      <div class="ltdy"><div class="ltl"></div>今日</div><div class="ldiv"></div>
      <div class="li"><strong style="color:#fff">◆</strong> マイルストーン(日付付)</div><div class="ldiv"></div>

<script>
// ═══════════════════════════════════════════════════
const DN=['設計部','調達部','工場','工事部'];
const DC={'設計部':{color:'#2563eb'},'調達部':{color:'#d97706'},'工場':{color:'#16a34a'},'工事部':{color:'#7c3aed'}};
const KEY_NAMES={approval:'承諾予定',order:'材料発注',fabrication:'製作開始',delivery:'現場搬入'};
const KEY_DEPT={approval:'設計部',order:'調達部',fabrication:'工場',delivery:'工場'};
const KEY_COLORS={approval:'#2563eb',order:'#d97706',fabrication:'#16a34a',delivery:'#16a34a'};

function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function fmt(d){return d.toISOString().slice(0,10)}
function fmtS(d){return(d.getMonth()+1)+'/'+d.getDate()}
function par(s){return s?new Date(s+'T00:00:00'):null}
function dB(a,b){return Math.round((b-a)/864e5)}

// ── Weekend & Workday utilities ──
function isWeekend(d){const dow=d.getDay();return dow===0||dow===6}
function countWorkdays(start,end){
  let count=0;const d=new Date(start);
  while(d<end){if(!isWeekend(d))count++;d.setDate(d.getDate()+1)}
  return count;
}
// Draw a rounded bar, dimming weekend portions (Option A)
function drawBarWithWeekendDim(ctx,bx1,by,bw,barH,col,mn,px,dx_fn,startDate,endDate,label){
  if(bw<=0)return;
  const rad=Math.min(4,bw/2);
  // 1. Draw full bar shape (clipping path)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(bx1+rad,by);ctx.lineTo(bx1+bw-rad,by);
  ctx.quadraticCurveTo(bx1+bw,by,bx1+bw,by+rad);
  ctx.lineTo(bx1+bw,by+barH-rad);
  ctx.quadraticCurveTo(bx1+bw,by+barH,bx1+bw-rad,by+barH);
  ctx.lineTo(bx1+rad,by+barH);
  ctx.quadraticCurveTo(bx1,by+barH,bx1,by+barH-rad);
  ctx.lineTo(bx1,by+rad);
  ctx.quadraticCurveTo(bx1,by,bx1+rad,by);
  ctx.closePath();
  ctx.clip();
  // 2. Fill workday portions at full opacity
  ctx.fillStyle=col+'cc';
  ctx.fillRect(bx1,by,bw,barH);
  // 3. Dim weekend portions with semi-transparent overlay + stripe
  const d=new Date(startDate);
  while(d<=endDate){
    if(isWeekend(d)){
      const wx=dx_fn(d),wx2=dx_fn(addD(d,1));
      // White overlay to fade
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.fillRect(wx,by,wx2-wx,barH);
      // Diagonal stripe pattern
      ctx.fillStyle='rgba(0,0,0,.06)';
      for(let sx=wx;sx<wx2;sx+=4){
        ctx.fillRect(sx,by,2,barH);
      }
    }
    d.setDate(d.getDate()+1);
  }
  // 4. Top highlight
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx1,by,bw,4);
  ctx.restore();
  // 5. Border (outside clip)
  ctx.strokeStyle=col;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(bx1+rad,by);ctx.lineTo(bx1+bw-rad,by);
  ctx.quadraticCurveTo(bx1+bw,by,bx1+bw,by+rad);
  ctx.lineTo(bx1+bw,by+barH-rad);
  ctx.quadraticCurveTo(bx1+bw,by+barH,bx1+bw-rad,by+barH);
  ctx.lineTo(bx1+rad,by+barH);
  ctx.quadraticCurveTo(bx1,by+barH,bx1,by+barH-rad);
  ctx.lineTo(bx1,by+rad);
  ctx.quadraticCurveTo(bx1,by,bx1+rad,by);
  ctx.closePath();ctx.stroke();
  // 6. Label
  if(label&&bw>30){
    ctx.fillStyle='#ffffff';ctx.font=`bold 10px ${FN}`;ctx.textAlign='center';
    ctx.fillText(label,bx1+bw/2,by+barH/2+4);
  }
}

// ═══════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════
let projects=[],selProjId=null,selSubIdx=0,wlBarI=null,projCtr=1;

function calcSub(s){
  const st=par(s.startDate),dl=par(s.deliveryDate);
  if(!st||!dl)return;
  const avail=dB(st,dl);
  const need=s.dur['設計部']+s.dur['調達部']+s.dur['工場'];
  s.available=avail; s.needed=need;
  s.status=need<=avail?'ok':'risk';

  const sk_st=st, sk_end=addD(st,s.dur['設計部']);
  const kj_end=dl, kj_st=addD(dl,-s.dur['工場']);
  const ki_st=dl, ki_end=addD(dl,s.dur['工事部']);

  if(s.status==='ok'){
    // Sequential — gap may arise between 調達部.end and 工場.start
    const ct_st=sk_end, ct_end=addD(sk_end,s.dur['調達部']);
    s.phases={'設計部':{start:sk_st,end:sk_end},'調達部':{start:ct_st,end:ct_end},'工場':{start:kj_st,end:kj_end},'工事部':{start:ki_st,end:ki_end}};
  } else {
    // Risky — overlaps needed
    const space=dB(sk_end,kj_st); // space available for 調達部
    const excess=s.dur['調達部']-space; // how much overlap needed
    const ol1=Math.ceil(excess/2);  // overlap with 設計部
    const ol2=Math.floor(excess/2); // overlap with 工場
    const ct_st=addD(sk_end,-ol1), ct_end=addD(ct_st,s.dur['調達部']);
    s.phases={'設計部':{start:sk_st,end:sk_end},'調達部':{start:ct_st,end:ct_end},'工場':{start:kj_st,end:kj_end},'工事部':{start:ki_st,end:ki_end}};
    s.overlap={ol1,ol2};
  }
}

function calcProj(p){
  p.subs.forEach(s=>calcSub(s));
  let mn=null,mx=null;
  p.subs.forEach(s=>{if(!s.phases||!s.phases['設計部'])return;DN.forEach(dn=>{const ph=s.phases[dn];if(!mn||ph.start<mn)mn=ph.start;if(!mx||ph.end>mx)mx=ph.end})});
  p.oStart=mn;p.oEnd=mx;
  // Project-level status: risky if any sub is risky
  p.status=p.subs.some(s=>s.status==='risk')?'risk':'ok';
}

function mkSub(name,sd,dd,ds,dc,dk,dki,kAppr,kOrd,kFab){
  return{name,startDate:sd,deliveryDate:dd,dur:{'設計部':ds,'調達部':dc,'工場':dk,'工事部':dki},
    keyDates:{approval:kAppr||'',order:kOrd||'',fabrication:kFab||'',delivery:dd},
    phases:{},status:'ok',available:0,needed:0,overlap:{ol1:0,ol2:0}};
}

function renderTree(){
  const el=document.getElementById('ptree');el.innerHTML='';
  projects.forEach(p=>{
    const wrap=document.createElement('div');wrap.className='pt-proj';
    // Project row
    const pr=document.createElement('div');
    pr.className='pt-row'+(selProjId===p.id&&selSubIdx===-1?' sel':'');
    const stCls=p.status==='ok'?'st-ok':'st-risk';

    pr.innerHTML=`<span class="pt-id">${p.id}</span><span class="pt-nm">${p.name}</span><span class="pt-st ${stCls}">${stTxt}</span>`;
    pr.onclick=()=>{selProjId=p.id;selSubIdx=-1;renderTree();renderForm()};
    wrap.appendChild(pr);
    // Sub-project rows
    const subWrap=document.createElement('div');subWrap.className='pt-sub';
    p.subs.forEach((s,i)=>{
      const sr2=document.createElement('div');
      sr2.className='pt-row'+(selProjId===p.id&&selSubIdx===i?' sel':'');
      const sCls=s.status==='ok'?'st-ok':'st-risk';
      const sTxt=s.status==='ok'?'✅ 正常':'⚠ リスク';
      sr2.innerHTML=`<span class="pt-id">└</span><span class="pt-nm">${s.name}</span><span class="pt-st ${sCls}">${sTxt}</span>`;
      sr2.onclick=(e)=>{e.stopPropagation();selProjId=p.id;selSubIdx=i;renderTree();renderForm()};
      subWrap.appendChild(sr2);
    });
    wrap.appendChild(subWrap);
    el.appendChild(wrap);

  document.getElementById('hdrInfo').innerHTML=`今日: ${fmt(new Date())} ｜ ${projects.length} PJ / ${projects.reduce((a,p)=>a+p.subs.length,0)} サブPJ`;
}

function renderForm(){

      <div class="form-actions">

        <div class="f"><label>現場搬入日（工場→現場）</label><input type="date" id="fDD" value="${s.deliveryDate}"></div>

    <div class="sec"><div class="sec-title">⏱ 部門所要期間</div>

// ═══════════════════════════════════════════════════
//  SUPABASE DATA LAYER
//  Replaces local array mutations with DB operations.
//  After every DB write, we re-fetch all data so
//  projects[] stays perfectly in sync.
// ═══════════════════════════════════════════════════

// ── Fetch all projects + sub_projects from Supabase → fill projects[] ──
async function fetchProjects() {
  console.log('[PMS] fetchProjects() — loading from Supabase...');
  const { data, error } = await sb
    .from('projects')
    .select('*, sub_projects(*)')
    .order('project_code', { ascending: true });

  if (error) {
    console.error('[PMS] fetchProjects ERROR:', error);
    console.error('[PMS] Check: Are SUPABASE_URL and SUPABASE_ANON set correctly?');
    projects = [];
    return;
  }
  if (!data) {
    console.warn('[PMS] fetchProjects returned null data — using empty array');
    projects = [];
    return;
  }
  console.log('[PMS] Raw Supabase response:', data);

  // Map Supabase rows → same shape as original projects[]
  projects = data.map(p => {
    const subs = (p.sub_projects || [])
      .sort((a, b) => a.sort_order - b.sort_order)
      .map(sp => {
        // Rebuild dur{} from JSONB durations column
        const dur = sp.durations || {};
        // Rebuild keyDates{} from JSONB key_dates column
        const kd = sp.key_dates || {};
        return {
          _dbId: sp.id,               // Keep Supabase UUID for updates
          name: sp.name,
          startDate: sp.start_date,
          deliveryDate: sp.delivery_date,
          dur: {
            '設計部': dur['設計部'] || 50,
            '調達部': dur['調達部'] || 55,
            '工場':   dur['工場']   || 45,
            '工事部': dur['工事部'] || 20,
          },
          keyDates: {
            approval:    kd.approval    || '',
            order:       kd.order       || '',
            fabrication: kd.fabrication  || '',
            delivery:    kd.delivery    || sp.delivery_date || '',
          },
          phases: {},
          status: 'ok',
          available: 0,
          needed: 0,
          overlap: { ol1: 0, ol2: 0 },
          sort_order: sp.sort_order,
        };
      });

    return {
      _dbId: p.id,                 // Keep Supabase UUID for updates
      id: p.project_code,          // Your visible ID (P-2601)
      name: p.name,
      subs: subs.length > 0 ? subs : [],
      status: 'ok',
      oStart: null,
      oEnd: null,
    };
  });

  // Recalculate scheduling for every project (same logic as before)
  projects.forEach(p => calcProj(p));

  // Update projCtr so new project IDs don't collide
  const maxNum = projects.reduce((mx, p) => {
    const m = p.id.match(/P-26(\d+)/);
    return m ? Math.max(mx, parseInt(m[1])) : mx;
  }, 0);
  projCtr = maxNum + 1;

  console.log('[PMS] projects[] rebuilt:', projects.length, 'projects,',
    projects.reduce((a, p) => a + p.subs.length, 0), 'sub-projects');
  console.log('[PMS] projCtr set to:', projCtr);
}

// ── Save a sub-project back to Supabase ──
async function saveSubToDb(p, s) {
  const payload = {
    project_id: p._dbId,
    name: s.name,
    start_date: s.startDate,
    delivery_date: s.deliveryDate,
    durations: {
      '設計部': s.dur['設計部'],
      '調達部': s.dur['調達部'],
      '工場':   s.dur['工場'],
      '工事部': s.dur['工事部'],
    },
    key_dates: {
      approval:    s.keyDates.approval,
      order:       s.keyDates.order,
      fabrication: s.keyDates.fabrication,
      delivery:    s.keyDates.delivery,
    },
    status: s.status,
    available_days: s.available,
    needed_days: s.needed,
    overlap_design_procurement: s.overlap?.ol1 || 0,
    overlap_procurement_factory: s.overlap?.ol2 || 0,
    sort_order: s.sort_order || 0,
  };

  if (s._dbId) {
    // UPDATE existing
    console.log('[PMS] Updating sub_project:', s._dbId, payload);
    const { error } = await sb.from('sub_projects').update(payload).eq('id', s._dbId);
    if (error) console.error('[PMS] Update sub ERROR:', error);
  } else {
    // INSERT new
    console.log('[PMS] Inserting new sub_project:', payload);
    const { data, error } = await sb.from('sub_projects').insert(payload).select();
    if (error) console.error('[PMS] Insert sub ERROR:', error);
    else if (data && data[0]) s._dbId = data[0].id;
  }
}

// ── Save project header to Supabase ──
async function saveProjToDb(p) {
  const payload = {
    project_code: p.id,
    name: p.name,
    status: p.status,
    overall_start: p.oStart ? fmt(p.oStart) : null,
    overall_end: p.oEnd ? fmt(p.oEnd) : null,
  };
  console.log('[PMS] Updating project:', p._dbId, payload);
  const { error } = await sb.from('projects').update(payload).eq('id', p._dbId);
  if (error) console.error('[PMS] Update project ERROR:', error);
}

async function delProj() {
  if (!selProjId) return;
  if (!confirm(`${selProjId} を削除？`)) return;

  const p = projects.find(x => x.id === selProjId);
  console.log('[PMS] delProj — deleting:', p?._dbId, selProjId);

  // ── Delete from Supabase (CASCADE deletes sub_projects too) ──
  if (p && p._dbId) {
    const { error } = await sb.from('projects').delete().eq('id', p._dbId);

  // Remove from local array
  projects = projects.filter(x => x.id !== selProjId);
  selProjId = null;
  selSubIdx = 0;
  renderTree(); renderForm();
}

// ═══════════════════════════════════════════════════
//  GANTT CHART — Full width, clean, no M-numbers
// ═══════════════════════════════════════════════════
let gPxPerDay=35; // ★ Mutable timescale — Ctrl+wheel adjusts this (10–80)
const G_LP=240,TP=72,PH_H=32,SPH_H=26,DR_H=32,BAR_H=20,PROJ_GAP=10,SP_BLK=SPH_H+4*DR_H;
const PX_PER_DAY=35; // Base constant for Task timeline (unchanged)
const FN='system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif';

function ppd(){return gPxPerDay}
function gZoom(delta){
  gPxPerDay=Math.max(10,Math.min(80,gPxPerDay+delta));
  renderGantt();
}
// Auto-range from project data (used as fallback or when 'auto' clicked)
function getAutoRange(){
  let mn=null,mx=null;
  projects.forEach(p=>{if(p.oStart&&(!mn||p.oStart<mn))mn=p.oStart;if(p.oEnd&&(!mx||p.oEnd>mx))mx=p.oEnd});
  if(!mn){mn=new Date();mx=addD(mn,360)}
  // Ensure range covers at least 7 days before today
  const today=new Date();today.setHours(0,0,0,0);
  const bufferStart=addD(today,-7);
  if(bufferStart<mn) mn=bufferStart;
  // Add padding and snap to month boundaries
  mn=addD(mn,-7);mx=addD(mx,14);
  mn=new Date(mn.getFullYear(),mn.getMonth(),1);mx=new Date(mx.getFullYear(),mx.getMonth()+1,0);
  return{mn,mx};
}
// Gantt date range — uses input fields (same pattern as Task timeline)
function gSetRange(r){
  if(r==='auto'){
    const{mn,mx}=getAutoRange();
    document.getElementById('gStart').value=fmt(mn);
    document.getElementById('gEnd').value=fmt(mx);
  } else {
    const t=new Date();
    document.getElementById('gStart').value=fmt(t);
    document.getElementById('gEnd').value=fmt(addD(t,r==='month'?30:r==='quarter'?90:180));
  }
  renderGantt();
}
function gGetRange(){
  let s=par(document.getElementById('gStart').value);
  let e=par(document.getElementById('gEnd').value);
  if(!s||!e){
    // Fallback to auto-range from data
    const auto=getAutoRange();
    s=auto.mn; e=auto.mx;
    document.getElementById('gStart').value=fmt(s);
    document.getElementById('gEnd').value=fmt(e);
  }
  return {mn:s,mx:e};
}
function projH(p){return PH_H+p.subs.length*SP_BLK+PROJ_GAP}

function renderGantt(){
  const LP=G_LP; // sidebar width
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
  const cvS=document.getElementById('gcSide'),ctxS=cvS.getContext('2d');
  const px=ppd(),{mn,mx}=gGetRange(),totD=dB(mn,mx);
  if(totD<=0)return;

  // Timeline canvas (no LP offset — starts at x=0)
  const TW=totD*px+40;
  let totH=TP;projects.forEach(p=>{totH+=projH(p)});totH+=20;
  cv.width=TW;cv.height=totH;
  // Sidebar canvas
  cvS.width=LP;cvS.height=totH;
  function dx(d){return dB(mn,d)*px}

  const ROW_M=0,ROW_D=32;
  const MN_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ════════════════════════════════════════
  // TIMELINE CANVAS (right, scrollable)
  // ════════════════════════════════════════
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,TW,totH);

  // ── Weekend shading ──
  {let d=new Date(mn);while(d<=mx){const dow=d.getDay();if(dow===0||dow===6){const x1=dx(d),x2=dx(addD(d,1));ctx.fillStyle=dow===0?'rgba(220,38,38,.06)':'rgba(37,99,235,.04)';ctx.fillRect(x1,TP,x2-x1,totH-TP)}d=addD(d,1)}}

  // ── Alternating month shading ──
  let cur=new Date(mn);
  while(cur<=mx){const x1=dx(cur),nm=new Date(cur.getFullYear(),cur.getMonth()+1,1),x2=Math.min(dx(nm),TW);if(cur.getMonth()%2===0){ctx.fillStyle='rgba(241,245,249,.4)';ctx.fillRect(x1,TP,x2-x1,totH-TP)}cur=nm}

  // ── Header backgrounds ──
  ctx.fillStyle='#1e293b';ctx.fillRect(0,ROW_M,TW,32);
  ctx.fillStyle='#f8fafc';ctx.fillRect(0,ROW_D,TW,TP-ROW_D);

  // ── Month labels ──
  cur=new Date(mn);
  while(cur<=mx){
    const x1=dx(cur),nm=new Date(cur.getFullYear(),cur.getMonth()+1,1),x2=Math.min(dx(nm),TW),mid=(x1+x2)/2;
    if(x1>0){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,0);ctx.lineTo(x1,32);ctx.stroke()}
    ctx.fillStyle='#ffffff';ctx.font=`bold 13px ${FN}`;ctx.textAlign='center';
    ctx.fillText(`${MN_FULL[cur.getMonth()]} ${cur.getFullYear()}`,mid,21);
    cur=nm;
  }

  // ── Per-day gridlines + day labels ──
  cur=new Date(mn);
  while(cur<=mx){
    const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    for(let day=1;day<=dim;day++){
      const dd2=new Date(cur.getFullYear(),cur.getMonth(),day),xx=dx(dd2);
      if(xx<-px||xx>TW)continue;
      const isFirst=(day===1);
      // Body gridline
      ctx.strokeStyle=isFirst?'#94a3b8':'#e2e8f0';ctx.lineWidth=isFirst?1.5:0.5;
      ctx.beginPath();ctx.moveTo(xx,TP);ctx.lineTo(xx,totH);ctx.stroke();
      // Header gridline
      ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(xx,ROW_D);ctx.lineTo(xx,TP);ctx.stroke();
    }
    // Day number labels (adaptive)
    let days;
    if(px>=18)     days=Array.from({length:dim},(_,i)=>i+1);
    else if(px>=12) days=Array.from({length:dim},(_,i)=>i+1).filter(d=>d%2===1||d===1);
    else if(px>=8) days=[1,5,10,15,20,25];
    else           days=[1,10,20];
    days.forEach(day=>{
      if(day>dim)return;
      const dd2=new Date(cur.getFullYear(),cur.getMonth(),day),xx=dx(dd2);
      if(xx<-px||xx>TW)return;
      const isSun=(dd2.getDay()===0),isSat=(dd2.getDay()===6);
      ctx.fillStyle=isSun?'#dc2626':isSat?'#2563eb':'#475569';
      ctx.font=(day===1?'bold ':'')+`11px ${FN}`;ctx.textAlign='center';
      ctx.fillText(String(day),xx+px/2,ROW_D+24);
    });
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }

  // ── Header borders ──
  ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,ROW_D);ctx.lineTo(TW,ROW_D);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,TP);ctx.lineTo(TW,TP);ctx.stroke();

  // ── Render project rows on timeline ──
  let yOff=TP;const keyLabels=[];
  projects.forEach(p=>{
    const bY=yOff;
    // Project header row background (timeline side)
    ctx.fillStyle=p.status==='ok'?'#eff6ff':'#fef2f2';ctx.fillRect(0,bY,TW,PH_H);
    // Overall bar
    if(p.oStart&&p.oEnd){const ox1=dx(p.oStart),ox2=dx(p.oEnd);ctx.fillStyle='rgba(37,99,235,.1)';ctx.fillRect(ox1,bY+10,ox2-ox1,12);ctx.strokeStyle='rgba(37,99,235,.3)';ctx.lineWidth=1;ctx.strokeRect(ox1,bY+10,ox2-ox1,12)}

    let sY=bY+PH_H;
    p.subs.forEach((sub,si)=>{
      if(!sub.phases||!sub.phases['設計部']){sY+=SP_BLK;return}
      // Sub header bg
      ctx.fillStyle='#eef2f7';ctx.fillRect(0,sY,TW,SPH_H);
      ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,sY+SPH_H);ctx.lineTo(TW,sY+SPH_H);ctx.stroke();

      // Dept rows
      DN.forEach((dn,di)=>{
        const ry=sY+SPH_H+di*DR_H,ph=sub.phases[dn],col=DC[dn].color;
        ctx.fillStyle=di%2===0?'#ffffff':'#f8fafc';ctx.fillRect(0,ry,TW,DR_H);
        ctx.strokeStyle='#f1f5f9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ry+DR_H);ctx.lineTo(TW,ry+DR_H);ctx.stroke();

        // Phase bar — with weekend dimming
        const bx1=dx(ph.start),bx2=dx(ph.end),bw=bx2-bx1,by=ry+(DR_H-BAR_H)/2;
        if(bw>0){
          const wd=countWorkdays(ph.start,ph.end);
          const calD=dB(ph.start,ph.end);
          const barLabel=bw>50?`${wd}稼働日 (${calD}日)`:bw>30?`${wd}稼働日`:'';
          drawBarWithWeekendDim(ctx,bx1,by,bw,BAR_H,col,mn,px,dx,ph.start,ph.end,barLabel);
        }

        // Gap indicator
        if(sub.status==='ok'&&dn==='調達部'){
          const gapStart=ph.end,gapEnd=sub.phases['工場'].start;
          if(gapEnd>gapStart){
            const gx1=dx(gapStart),gx2=dx(gapEnd);
            ctx.setLineDash([4,4]);ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(gx1,by+BAR_H/2);ctx.lineTo(gx2,by+BAR_H/2);ctx.stroke();ctx.setLineDash([]);
            const gapWd=countWorkdays(gapStart,gapEnd);
            if(gx2-gx1>24){ctx.fillStyle='#64748b';ctx.font=`10px ${FN}`;ctx.textAlign='center';ctx.fillText(`${gapWd}稼働日余裕`,(gx1+gx2)/2,by+BAR_H/2-5)}
          }
        }

        // Overlap hatching
        if(sub.status==='risk'){
          const nxt=DN[di+1];
          if(nxt&&sub.phases[nxt]){
            const nph=sub.phases[nxt];
            if(nph.start<ph.end){
              const ox1=dx(nph.start),ox2=dx(ph.end);
              if(ox2>ox1){ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#f59e0b';for(let sx=ox1-BAR_H;sx<ox2;sx+=6){ctx.beginPath();ctx.moveTo(sx,by+BAR_H);ctx.lineTo(sx+BAR_H,by);ctx.lineTo(sx+BAR_H+2,by);ctx.lineTo(sx+2,by+BAR_H);ctx.closePath();ctx.fill()}ctx.restore()}
            }
          }
        }
      });

      // Key milestones
      Object.entries(sub.keyDates).forEach(([key,val])=>{
        if(!val)return;const d=par(val);if(!d)return;
        const col=KEY_COLORS[key],label=KEY_NAMES[key],dept=KEY_DEPT[key];
        const di=DN.indexOf(dept);if(di<0)return;
        const ry=sY+SPH_H+di*DR_H,mx2=dx(d),cy=ry+DR_H/2,by=ry+(DR_H-BAR_H)/2,rr=6;
        ctx.shadowColor=col;ctx.shadowBlur=4;
        ctx.fillStyle='#ffffff';ctx.strokeStyle=col;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(mx2,cy-rr);ctx.lineTo(mx2+rr,cy);ctx.lineTo(mx2,cy+rr);ctx.lineTo(mx2-rr,cy);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.shadowBlur=0;
        keyLabels.push({x:mx2,y:by-2,label:`${label} ${fmtS(d)}`,col});
      });

      sY+=SP_BLK;
    });

    yOff+=projH(p);
    ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,yOff-PROJ_GAP);ctx.lineTo(TW,yOff-PROJ_GAP);ctx.stroke();
  });

  // Key milestone labels (top layer)
  keyLabels.forEach(({x,y,label,col})=>{
    ctx.font=`bold 10px ${FN}`;const tw=ctx.measureText(label).width;
    const pw=tw+10,ph2=18,px2=x-pw/2,py=y-ph2-3,rr=4;
    ctx.fillStyle='#ffffff';ctx.globalAlpha=.95;
    ctx.beginPath();ctx.moveTo(px2+rr,py);ctx.lineTo(px2+pw-rr,py);ctx.quadraticCurveTo(px2+pw,py,px2+pw,py+rr);ctx.lineTo(px2+pw,py+ph2-rr);ctx.quadraticCurveTo(px2+pw,py+ph2,px2+pw-rr,py+ph2);ctx.lineTo(px2+rr,py+ph2);ctx.quadraticCurveTo(px2,py+ph2,px2,py+ph2-rr);ctx.lineTo(px2,py+rr);ctx.quadraticCurveTo(px2,py,px2+rr,py);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(label,x,py+13);

  ctxS.beginPath();ctxS.moveTo(0,TP);ctxS.lineTo(LP,TP);ctxS.stroke();

  // Project/sub labels
  yOff=TP;
  projects.forEach(p=>{
    const bY=yOff;
    // Project header
    ctxS.fillStyle=p.status==='ok'?'#eff6ff':'#fef2f2';ctxS.fillRect(0,bY,LP,PH_H);
    ctxS.fillStyle='#1e40af';ctxS.font=`bold 13px ${FN}`;ctxS.textAlign='left';

    ctxS.fillStyle=p.status==='ok'?'#16a34a':'#dc2626';ctxS.font=`bold 11px ${FN}`;ctxS.textAlign='right';
    ctxS.fillText(p.status==='ok'?'✅ 正常':'⚠ リスク',LP-10,bY+21);

      ctxS.strokeStyle='#e2e8f0';ctxS.lineWidth=1;ctxS.beginPath();ctxS.moveTo(0,sY+SPH_H);ctxS.lineTo(LP,sY+SPH_H);ctxS.stroke();

      DN.forEach((dn,di)=>{
        const ry=sY+SPH_H+di*DR_H,col=DC[dn].color;
        ctxS.fillStyle=di%2===0?'#f8fafc':'#f1f5f9';ctxS.fillRect(0,ry,LP,DR_H);

      });

    });

    ctxS.strokeStyle='#cbd5e1';ctxS.lineWidth=1;ctxS.beginPath();ctxS.moveTo(0,yOff-PROJ_GAP);ctxS.lineTo(LP,yOff-PROJ_GAP);ctxS.stroke();
  });

  // ── Sync scrolling: timeline scroll → sidebar scroll ──
  const scrollEl=document.getElementById('gScroll');
  const sideEl=document.getElementById('gSidebar');
  // Detach old handler to avoid stacking
  scrollEl._gSyncScroll && scrollEl.removeEventListener('scroll',scrollEl._gSyncScroll);
  scrollEl._gSyncScroll=()=>{sideEl.scrollTop=scrollEl.scrollTop};
  scrollEl.addEventListener('scroll',scrollEl._gSyncScroll);

  document.getElementById('zInfo').textContent=`${fmt(mn)} 〜 ${fmt(mx)}（${totD}日 / ${projects.length}PJ / ${Math.round(px)}px/日）`;
}

  const allS=[];projects.forEach(p=>p.subs.forEach(s=>{if(s.phases&&s.phases['設計部'])allS.push({proj:p,sub:s})}));
  const dd={};DN.forEach(dn=>{dd[dn]=months.map(m=>{const mS=m,mE=new Date(m.getFullYear(),m.getMonth()+1,0);return allS.filter(({sub})=>{const ph=sub.phases[dn];return ph.start<=mE&&ph.end>=mS}).length})});

  document.getElementById('statRow').innerHTML=DN.map(d=>{const col=DC[d].color;const pk=Math.max(...dd[d]);const ci=months.findIndex(m=>{const n=new Date();n.setHours(0,0,0,0);return n>=m&&n<=new Date(m.getFullYear(),m.getMonth()+1,0)});return`<div class="sc" style="border-top-color:${col}"><div class="sl">${d}</div><div class="sv" style="color:${col}">${ci>=0?dd[d][ci]:0}</div><div class="ss">現在稼働 / ピーク ${pk}</div></div>`}).join('');

  const ctx2=document.getElementById('wlBar').getContext('2d');
  if(wlBarI)wlBarI.destroy();
  wlBarI=new Chart(ctx2,{type:'bar',data:{labels,datasets:DN.map(d=>({label:d,data:dd[d],backgroundColor:DC[d].color+'cc',borderColor:DC[d].color,borderWidth:1,borderRadius:3}))},options:{responsive:true,interaction:{mode:'index'},plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}},scales:{x:{ticks:{color:'#7a91b0',font:{size:10}},grid:{color:'rgba(45,63,90,.5)'}},y:{ticks:{color:'#7a91b0',stepSize:1},grid:{color:'rgba(45,63,90,.5)'},title:{display:true,text:'稼働サブPJ数',color:'#7a91b0'}}}}});

  const rows=allS.map(({proj:p,sub:s})=>{
    const dur=dB(s.phases['設計部'].start,s.phases['工事部'].end);
    const stC=s.status==='ok'?'st-ok':'st-risk';const stT=s.status==='ok'?'✅ 正常':'⚠ リスク';
    const cells=DN.map(dn=>{const d=dB(s.phases[dn].start,s.phases[dn].end);return`<td><span class="badge" style="background:${DC[dn].color}">${d}日</span></td>`}).join('');
    return`<tr><td><strong>${p.id}</strong></td><td>${s.name}</td><td>${s.startDate}</td><td style="color:var(--ok)">${s.deliveryDate}</td><td><span class="pt-st ${stC}">${stT}</span></td><td>${dur}日</td>${cells}</tr>`;
  }).join('');
  document.getElementById('wlTbl').innerHTML=`<thead><tr><th>PJ</th><th>サブPJ</th><th>着工日</th><th>搬入日</th><th>状態</th><th>総工期</th>${DN.map(d=>`<th style="color:${DC[d].color}">${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>`;
}

// ── Lane assignment: greedy algorithm for overlapping tasks ──
// Returns Map<userId, {tasks: [{task, lane}...], maxLane: number}>
function assignTaskLanes(tasks,mn,mx){
  const userMap=new Map();
  // Group tasks by user
  tasks.forEach(t=>{
    const ts=par(t.start_date),te=par(t.end_date);
    if(!ts||!te||te<mn||ts>mx) return;
    if(!userMap.has(t.assigned_user_id)) userMap.set(t.assigned_user_id,{tasks:[],maxLane:0});
    userMap.get(t.assigned_user_id).tasks.push({task:t,start:ts,end:te,lane:0});
  });
  // For each user, sort by start_date then assign lanes greedily
  userMap.forEach(ud=>{
    ud.tasks.sort((a,b)=>a.start-b.start||a.end-b.end);
    // laneEnds[i] = the end date of the last task placed in lane i
    const laneEnds=[];
    ud.tasks.forEach(item=>{
      let placed=false;
      for(let i=0;i<laneEnds.length;i++){
        // No overlap if this task starts after the lane's last task ends
        if(item.start>laneEnds[i]){
          item.lane=i;
          laneEnds[i]=item.end;
          placed=true;
          break;
        }
      }
      if(!placed){
        item.lane=laneEnds.length;
        laneEnds.push(item.end);
      }
    });
    ud.maxLane=laneEnds.length;
  });
  return userMap;
}

// ── Save / Delete tasks ──
async function saveTask(){
  const title=document.getElementById('tkTitle').value.trim();
  const userId=document.getElementById('tkUser').value;
  const sd=document.getElementById('tkSD').value;
  const ed=document.getElementById('tkED').value;
  if(!title){alert('タスク名を入力してください');return}
  if(!userId){alert('担当者を選択してください');return}
  if(!sd||!ed){alert('日付を入力してください');return}
  if(sd>ed){alert('終了日は開始日以降にしてください');return}
  const payload={
    title, assigned_user_id:userId,
    project_id:document.getElementById('tkProj').value||null,
    sub_project_id:document.getElementById('tkSubProj').value||null,
    start_date:sd, end_date:ed,
    notes:document.getElementById('tkNotes').value.trim(),
    priority:document.getElementById('tkPriority').value||'medium',
    status:tkEditId?(tkTasks.find(t=>t.id===tkEditId)||{}).status||'pending':'pending'
  };
  if(tkEditId){
    const {data,error}=await sb.from('tasks').update(payload).eq('id',tkEditId).select();
    if(error){alert('更新エラー: '+error.message);console.error('[TK] update error:',error);return}
    console.log('[TK] Task updated:',data);
  } else {
    const {data,error}=await sb.from('tasks').insert(payload).select();
    if(error){alert('作成エラー: '+error.message);console.error('[TK] insert error:',error);return}
    console.log('[TK] Task created:',data);
  }
  cancelTaskForm();
  await fetchTasks();
  console.log('[TK] After fetch: tkTasks.length=',tkTasks.length);
  // Auto-expand date range if the saved task falls outside the current view
  const curS=par(document.getElementById('tkStart').value);
  const curE=par(document.getElementById('tkEnd').value);
  const taskS=par(sd), taskE=par(ed);
  if(curS&&curE&&taskS&&taskE){
    let changed=false;
    if(taskS<curS){document.getElementById('tkStart').value=fmt(addD(taskS,-7));changed=true}
    if(taskE>curE){document.getElementById('tkEnd').value=fmt(addD(taskE,7));changed=true}
    if(changed) console.log('[TK] Date range auto-expanded to include task');
  }
  renderTimeline();
}

async function deleteTask(){
  if(!tkEditId||!confirm('このタスクを削除しますか？')) return;
  const {error}=await sb.from('tasks').delete().eq('id',tkEditId);
  if(error){alert('削除エラー: '+error.message);return}
  cancelTaskForm(); await fetchTasks(); renderTimeline();
}

async function toggleTaskComplete(){
  if(!tkEditId) return;
  const task=tkTasks.find(t=>t.id===tkEditId);
  if(!task) return;
  const newStatus=task.status==='completed'?'pending':'completed';
  const {error}=await sb.from('tasks').update({status:newStatus}).eq('id',tkEditId).select();
  if(error){alert('ステータス更新エラー: '+error.message);console.error('[TK] status error:',error);return}
  console.log('[TK] Task status →',newStatus);
  await fetchTasks();
  // Re-open to refresh the form state
  const updated=tkTasks.find(t=>t.id===tkEditId);
  if(updated) openEditTask(updated);
  renderTimeline();
}

function openEditTask(task){
  tkEditId=task.id;
  const p=document.getElementById('tkFormPanel');
  p.classList.add('open');
  document.getElementById('tkFormTitle').textContent='タスク編集';
  document.getElementById('tkDelBtn').style.display='';
  document.getElementById('tkTitle').value=task.title;
  document.getElementById('tkSD').value=task.start_date;
  document.getElementById('tkED').value=task.end_date;
  document.getElementById('tkNotes').value=task.notes||'';
  // Priority
  document.getElementById('tkPriority').value=task.priority||'medium';
  // Status display
  const isCompleted=(task.status==='completed');
  document.getElementById('tkStatusRow').style.display='';
  const statusLabel=document.getElementById('tkStatusLabel');
  statusLabel.textContent=isCompleted?'✔ 完了':'⏳ 進行中';
  statusLabel.style.color=isCompleted?'#16a34a':'#d97706';
  // Complete / reopen button
  const cBtn=document.getElementById('tkCompleteBtn');
  cBtn.style.display='';
  if(isCompleted){cBtn.textContent='↩ 未完了に戻す';cBtn.style.background='#d97706'}
  else{cBtn.textContent='✔ 完了にする';cBtn.style.background='#16a34a'}
  // Set org dropdowns
  tkPopulateDepts();
  const user=tkProfiles.find(u=>u.id===task.assigned_user_id);
  if(user&&user.department_id){
    document.getElementById('tkDept').value=user.department_id;
    tkDeptChanged();
    if(user.section_id){document.getElementById('tkSec').value=user.section_id;tkSecChanged()}
  }
  document.getElementById('tkUser').value=task.assigned_user_id;
  // Set project dropdowns
  tkPopulateProjects();
  if(task.project_id){
    document.getElementById('tkProj').value=task.project_id;
    tkProjChanged();
    if(task.sub_project_id) document.getElementById('tkSubProj').value=task.sub_project_id;
  }
}

// ── Build org tree for timeline ──
function buildOrgTree(){
  const tree=[];
  tkDepts.forEach(d=>{
    const deptSecs=[];
    tkSecs.filter(s=>s.department_id===d.id).forEach(s=>{
      const users=tkProfiles.filter(u=>u.section_id===s.id && u.department_id===d.id);
      if(users.length) deptSecs.push({sec:s,users});
    });
    if(deptSecs.length) tree.push({dept:d,sections:deptSecs});
  });
  // Unassigned users
  const assigned=new Set();
  tree.forEach(d=>d.sections.forEach(s=>s.users.forEach(u=>assigned.add(u.id))));
  const unassigned=tkProfiles.filter(u=>!assigned.has(u.id));
  if(unassigned.length){
    tree.push({dept:{id:'_unassigned',name:'未配属'},sections:[{sec:{id:'_unsec',name:'—'},users:unassigned}]});
  }
  return tree;
}

// ═══════════════════════════════════════════════════
//  TIMELINE RENDERER (Canvas)
//  Y-axis: Department → Section → Users
//  X-axis: Dates
//  Bars: Tasks
// ═══════════════════════════════════════════════════
function renderTimeline(){
  const cv=document.getElementById('tkCv'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const {mn,mx}=tkGetRange();
  const totD=dB(mn,mx); if(totD<=0) return;
  const tree=buildOrgTree();
  tkBarRects=[];

  // ── Pre-compute lane assignments for all users ──
  const laneMap=assignTaskLanes(tkTasks,mn,mx);
  // Debug: check for tasks assigned to users not in the org tree
  if(laneMap.size>0){
    const treeUserIds=new Set();
    tree.forEach(d=>d.sections.forEach(s=>s.users.forEach(u=>treeUserIds.add(u.id))));
    laneMap.forEach((ud,uid)=>{
      if(!treeUserIds.has(uid)) console.warn('[TK] Task(s) assigned to user',uid,'who is not in org tree — they won\'t render. Check 組織設定.');
    });
  }

  // ── Build row positions (dynamic height for users with overlapping tasks) ──
  const rows=[]; let bodyH=0;
  tree.forEach(d=>{
    rows.push({type:'dept',y:bodyH,h:TK_DEPT,data:d.dept});
    bodyH+=TK_DEPT;
    d.sections.forEach(s=>{
      rows.push({type:'sec',y:bodyH,h:TK_SEC,data:s.sec});
      bodyH+=TK_SEC;
      s.users.forEach((u,ui)=>{
        const ud=laneMap.get(u.id);
        const lanes=ud?ud.maxLane:1;
        // Dynamic row height: at least TK_ROW_BASE, grows with lane count
        const rowH=Math.max(TK_ROW_BASE, lanes*TK_LANE_H + TK_LANE_PAD*2);
        rows.push({type:'user',y:bodyH,h:rowH,data:u,deptId:d.dept.id,odd:ui%2===1,lanes});
        bodyH+=rowH;
      });
    });
  });

  // ── Canvas size — fixed PX_PER_DAY, always scrollable ──
  const px=PX_PER_DAY;
  const scrollW=document.getElementById('tkScroll').clientWidth||800;
  const W=Math.max(scrollW,TK_LP+totD*px+40);
  const H=TK_HDR+bodyH+10;
  cv.width=W; cv.height=Math.max(H,200);
  function dx(d){return TK_LP+dB(mn,d)*px}

  // ── Empty state ──
  if(rows.length===0){
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,cv.height);
    ctx.fillStyle='#94a3b8';ctx.font=`16px ${FN}`;ctx.textAlign='center';
    ctx.fillText('⚙ 組織設定 から部門・セクション・ユーザーを追加してください',W/2,cv.height/2);
    return;
  }

  // ════ LAYER 1: Backgrounds ════
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,cv.height);

  const ROW_M=0, ROW_D=32;
  const MN_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ── Weekend shading ──
  {
    let d=new Date(mn);
    while(d<=mx){
      const dow=d.getDay();
      if(dow===0||dow===6){
        const x1=dx(d),x2=dx(addD(d,1));
        ctx.fillStyle=dow===0?'rgba(220,38,38,.04)':'rgba(37,99,235,.03)';
        ctx.fillRect(x1,TK_HDR,x2-x1,H-TK_HDR);
      }
      d=addD(d,1);
    }
  }

  // Alternating month shading
  let cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<=mx){
    const x1=dx(cur),nm=new Date(cur.getFullYear(),cur.getMonth()+1,1),x2=Math.min(dx(nm),W);
    if(cur.getMonth()%2===0){
      ctx.fillStyle='rgba(241,245,249,.5)';
      ctx.fillRect(Math.max(x1,TK_LP),TK_HDR,x2-Math.max(x1,TK_LP),H-TK_HDR);
    }
    cur=nm;
  }

  // Row backgrounds
  rows.forEach(r=>{
    const ry=TK_HDR+r.y;
    if(r.type==='dept'){
      ctx.fillStyle='#e2e8f0';ctx.fillRect(0,ry,W,r.h);
    } else if(r.type==='sec'){
      ctx.fillStyle='#eef1f6';ctx.fillRect(0,ry,TK_LP,r.h);
    } else {
      ctx.fillStyle=r.odd?'#f8fafc':'#fff';ctx.fillRect(TK_LP,ry,W-TK_LP,r.h);
      ctx.fillStyle=r.odd?'#f1f5f9':'#f8fafc';ctx.fillRect(0,ry,TK_LP,r.h);
    }
  });

  // Header backgrounds
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,TK_LP,32);
  ctx.fillStyle='#1e293b';ctx.fillRect(TK_LP,ROW_M,W-TK_LP,32); // month row dark
  ctx.fillStyle='#f8fafc';ctx.fillRect(TK_LP,ROW_D,W-TK_LP,TK_HDR-ROW_D); // day row
  ctx.fillStyle='#f1f5f9';ctx.fillRect(0,ROW_D,TK_LP,TK_HDR-ROW_D);

  // ════ LAYER 2: Grid lines (per day) ════
  cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<=mx){
    const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    for(let day=1;day<=dim;day++){
      const dd2=new Date(cur.getFullYear(),cur.getMonth(),day),xx=dx(dd2);
      if(xx<TK_LP||xx>W) continue;
      const isFirst=(day===1);
      ctx.strokeStyle=isFirst?'#94a3b8':'#e2e8f0';
      ctx.lineWidth=isFirst?1.5:0.5;
      ctx.beginPath();ctx.moveTo(xx,TK_HDR);ctx.lineTo(xx,H);ctx.stroke();
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  // Row separators
  rows.forEach(r=>{
    if(r.type==='user'){
      const ry=TK_HDR+r.y+r.h;
      ctx.strokeStyle='#eef1f6';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(TK_LP,ry);ctx.lineTo(W,ry);ctx.stroke();
    }
  });
  // Header & panel borders
  ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,ROW_D);ctx.lineTo(W,ROW_D);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,TK_HDR);ctx.lineTo(W,TK_HDR);ctx.stroke();
  ctx.beginPath();ctx.moveTo(TK_LP,0);ctx.lineTo(TK_LP,H);ctx.stroke();

  // ════ LAYER 3: Text labels ════
  // Month labels (white on dark)
  cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<=mx){
    const x1=Math.max(dx(cur),TK_LP),nm=new Date(cur.getFullYear(),cur.getMonth()+1,1),x2=Math.min(dx(nm),W);
    const mid=(x1+x2)/2;
    if(x1>TK_LP){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,0);ctx.lineTo(x1,32);ctx.stroke()}
    ctx.fillStyle='#ffffff';ctx.font=`bold 13px ${FN}`;ctx.textAlign='center';
    ctx.fillText(`${MN_FULL[cur.getMonth()]} ${cur.getFullYear()}`,mid,21);
    cur=nm;
  }
  // Day number labels
  cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<=mx){
    const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    // Show every day since we have 35px per day
    let days;
    if(px>=18)     days=Array.from({length:dim},(_,i)=>i+1);
    else if(px>=12) days=Array.from({length:dim},(_,i)=>i+1).filter(d=>d%2===1||d===1);
    else if(px>=8) days=[1,5,10,15,20,25];
    else           days=[1,10,20];
    days.forEach(day=>{
      if(day>dim) return;
      const dd2=new Date(cur.getFullYear(),cur.getMonth(),day),xx=dx(dd2);
      if(xx<TK_LP||xx>W) return;
      const isSun=dd2.getDay()===0,isSat=dd2.getDay()===6;
      ctx.fillStyle=isSun?'#dc2626':isSat?'#2563eb':'#475569';
      ctx.font=(day===1?'bold ':'')+'11px '+FN;
      ctx.textAlign='center';
      ctx.fillText(String(day),xx+px/2,ROW_D+24);
    });
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  // Left header labels
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font=`bold 10px ${FN}`;ctx.textAlign='left';
  ctx.fillText('組織 / 担当者',8,20);
  ctx.fillStyle='#475569';ctx.font=`10px ${FN}`;ctx.fillText('日付 →',8,ROW_D+24);

  // Row labels
  rows.forEach(r=>{
    const ry=TK_HDR+r.y;
    if(r.type==='dept'){
      ctx.fillStyle='#1e293b';ctx.font=`bold 12px ${FN}`;ctx.textAlign='left';
      ctx.fillText(r.data.name,12,ry+r.h/2+5);
    } else if(r.type==='sec'){
      ctx.fillStyle='#64748b';ctx.font=`bold 11px ${FN}`;ctx.textAlign='left';
      ctx.fillText(r.data.name,28,ry+r.h/2+4);
    } else {
      // For multi-lane rows, place name near top; for single-lane, center it
      const nameY=r.h>TK_ROW_BASE?ry+18:ry+r.h/2+5;
      ctx.fillStyle='#1e293b';ctx.font=`13px ${FN}`;ctx.textAlign='left';
      ctx.fillText(r.data.full_name||'—',40,nameY);
      // Show lane count indicator for multi-lane users
      if(r.lanes&&r.lanes>1){
        ctx.fillStyle='#94a3b8';ctx.font=`10px ${FN}`;ctx.textAlign='left';
        ctx.fillText(`${r.lanes}件並行`,40,nameY+14);
      }
    }
  });

  // ════ LAYER 4: Task bars — priority-colored, lane-stacked, weekend-dimmed ════
  rows.filter(r=>r.type==='user').forEach(r=>{
    const ry=TK_HDR+r.y;
    const ud=laneMap.get(r.data.id);
    if(!ud)return;

    ud.tasks.forEach(item=>{
      const t=item.task,ts=item.start,te=item.end;
      const bx1=Math.max(dx(ts),TK_LP+1);
      const bx2=Math.min(dx(addD(te,1)),W-5);
      const bw=bx2-bx1; if(bw<=0) return;
      // Vertical position: base + pad + lane * lane_height
      const by=ry+TK_LANE_PAD+item.lane*TK_LANE_H;
      const barH=TK_LANE_H-4; // small gap between lanes
      // Priority-based color (fallback to medium orange)
      const col=TK_PRIORITY_COLORS[t.priority]||TK_PRIORITY_COLORS.medium;
      const isCompleted=(t.status==='completed');
      // Dim completed tasks
      if(isCompleted) ctx.globalAlpha=0.4;
      // Draw bar with weekend dimming
      const wd=countWorkdays(ts,addD(te,1));
      const doneTag=isCompleted?' ✔':'';
      const barLabel=bw>60?`${t.title}${doneTag} (${wd}稼働日)`:`${t.title}${doneTag}`;
      drawBarWithWeekendDim(ctx,bx1,by,bw,barH,col,mn,px,dx,ts,te,null);
      // Label inside bar
      if(bw>30){
        ctx.save();
        ctx.beginPath();ctx.rect(bx1+2,by,bw-4,barH);ctx.clip();
        ctx.fillStyle='#fff';ctx.font=`bold 10px ${FN}`;ctx.textAlign='left';
        if(isCompleted){
          // Strikethrough for completed tasks
          const txt=barLabel;
          const tw=ctx.measureText(txt).width;
          ctx.fillText(txt,bx1+6,by+barH/2+4);
          ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(bx1+5,by+barH/2+1);ctx.lineTo(bx1+7+Math.min(tw,bw-10),by+barH/2+1);ctx.stroke();
        } else {
          ctx.fillText(barLabel,bx1+6,by+barH/2+4);
        }
        ctx.restore();
      }
      // Restore alpha
      if(isCompleted) ctx.globalAlpha=1.0;
      // Store rect for click detection
      tkBarRects.push({x:bx1,y:by,w:bw,h:barH,task:t});
    });
  });

  // ════ LAYER 5: Today line — prominent ════
  const today=new Date();today.setHours(0,0,0,0);
  if(today>=mn&&today<=mx){
    const tx=dx(today);
    // Highlight strip
    ctx.fillStyle='rgba(220,38,38,.06)';ctx.fillRect(tx,TK_HDR,px,H-TK_HDR);
    // Solid line
    ctx.strokeStyle='#dc2626';ctx.lineWidth=2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(tx,ROW_D);ctx.lineTo(tx,H);ctx.stroke();
    // Badge
    ctx.fillStyle='#dc2626';
    const bw=70,bh=20,bx=tx-bw/2,by=ROW_D+6;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font=`bold 11px ${FN}`;ctx.textAlign='center';
    ctx.fillText('▼ TODAY',tx,by+14);
  }
}

// ── Canvas click → edit task ──
let tkClickInit=false;
function initTimelineClick(){
  if(tkClickInit) return;
  tkClickInit=true;
  const cv=document.getElementById('tkCv'); if(!cv) return;
  cv.addEventListener('click',e=>{
    const rect=cv.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    for(let i=tkBarRects.length-1;i>=0;i--){
      const b=tkBarRects[i];
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        openEditTask(b.task); return;
      }
    }
  });
  cv.addEventListener('mousemove',e=>{
    const rect=cv.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    const hit=tkBarRects.some(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
    cv.style.cursor=hit?'pointer':'default';
  });
}

  const el = document.getElementById('authMsg');

function clearAuthMsg() {

// ── Handle form submit (login or signup) ──
async function handleAuth(e) {
  e.preventDefault();
  const btn = document.getElementById('authSubmit');
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPass').value;
  const name  = document.getElementById('authName').value.trim();

  btn.disabled = true;
  clearAuthMsg();

  try {
    if (authMode === 'signup') {
      // ── SIGNUP ──
      const { data, error } = await sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: { full_name: name || email.split('@')[0] }
        }
      });
      if (error) throw error;

      // Supabase may require email confirmation
      if (data.user && !data.session) {
        showAuthMsg('確認メールを送信しました。メール内のリンクをクリックしてください。', 'ok');
      } else if (data.session) {
        // Auto-confirmed (e.g., when email confirmation is disabled)
        enterApp(data.session);
      }

    } else {
      // ── LOGIN ──
      const { data, error } = await sb.auth.signInWithPassword({
        email,
        password: pass
      });
      if (error) throw error;
      enterApp(data.session);
    }
  } catch (err) {
    const msg = err.message || 'エラーが発生しました';
    // Translate common Supabase error messages
    const translations = {
      'Invalid login credentials': 'メールアドレスまたはパスワードが正しくありません',
      'User already registered': 'このメールアドレスは既に登録されています',
      'Password should be at least 6 characters': 'パスワードは6文字以上にしてください',
      'Unable to validate email address: invalid format': 'メールアドレスの形式が正しくありません',
      'Email rate limit exceeded': 'しばらく時間を置いてから再度お試しください',
    };
    showAuthMsg(translations[msg] || msg, 'err');
  } finally {
    btn.disabled = false;
  }
  return false;
}

  }
  appEntered = true;

  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.add('visible');

  // Display user info in header
  const user = session.user;
  const displayName = user.user_metadata?.full_name || user.email;
  document.getElementById('userName').textContent = displayName;
  console.log('[PMS] enterApp — user:', user.id, displayName);

  // ── Load all projects from Supabase ──
  await fetchProjects();

  // ── Ensure user has a profile row (for task system) ──
  await ensureProfile();

  // Now render with real data
  renderTree();
  renderForm();
  console.log('[PMS] enterApp — UI rendered with', projects.length, 'projects');
}

// ── Show auth, hide PMS, CLEAR LOCAL DATA ──
function exitApp() {
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appShell').classList.remove('visible');
  // Clear local data so next user starts fresh
  projects = [];
  selProjId = null;
  selSubIdx = 0;
  projCtr = 1;
  appEntered = false;  // Reset guard so next login can enter
  console.log('[PMS] exitApp — local data cleared');
  // Reset form
  document.getElementById('authForm').reset();
  clearAuthMsg();
  switchAuthTab('login');
}

// ── Listen for auth state changes (handles tab switches, token refresh) ──
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) {
    enterApp(session);
  } else if (event === 'SIGNED_OUT') {
    exitApp();
  }
});

// ═══════════════════════════════════════════════════
//  INIT — check for existing session
// ═══════════════════════════════════════════════════
(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    enterApp(session);
  }
  // If no session, authScreen is already visible (default)
})();

window.addEventListener('resize', () => {
  if (document.getElementById('pgGantt').classList.contains('on')) renderGantt();
  const tkEl=document.getElementById('pgTask');
  if(tkEl && tkEl.classList.contains('on')) renderTimeline();
});

// ═══════════════════════════════════════════════════
//  GANTT CTRL+WHEEL ZOOM
//  Scroll up → zoom in, scroll down → zoom out
//  Zoom is centered on the cursor's date position
// ═══════════════════════════════════════════════════
(function initGanttZoom(){
  let hintTimer=null;
  const hint=()=>document.getElementById('gZoomHint');
  function showHint(){
    const h=hint();if(!h)return;
    h.style.opacity='1';
    clearTimeout(hintTimer);
    hintTimer=setTimeout(()=>{h.style.opacity='0'},1200);
  }

  // Attach after DOM ready (this IIFE runs at end of <script>)
  const scrollEl=()=>document.getElementById('gScroll');

  document.addEventListener('wheel',function(e){
    const el=scrollEl();if(!el)return;
    // Only act when the wheel event is inside the Gantt timeline area
    if(!el.contains(e.target)&&e.target!==el)return;
    if(!e.ctrlKey&&!e.metaKey)return;

    e.preventDefault();

    // Calculate date under cursor before zoom
    const rect=el.getBoundingClientRect();
    const cursorX=e.clientX-rect.left+el.scrollLeft;
    const oldPx=gPxPerDay;
    const dateOffset=cursorX/oldPx; // fractional day offset from range start

    // Apply zoom
    const step=e.deltaY<0?3:-3; // scroll up=zoom in, down=zoom out
    gPxPerDay=Math.max(10,Math.min(80,gPxPerDay+step));

    if(gPxPerDay===oldPx)return; // no change at limits

    // Re-render
    renderGantt();

    // Restore scroll so the date under cursor stays in place
    const newX=dateOffset*gPxPerDay;
    el.scrollLeft=newX-(e.clientX-rect.left);

    showHint();
    // Update hint text
    const h=hint();
    if(h) h.textContent=`${gPxPerDay}px/日`;
  },{passive:false});

  // Show a brief "Ctrl+Scroll" hint when user scrolls normally over the Gantt
  let normalScrollHintShown=false;
  document.addEventListener('wheel',function(e){
    const el=scrollEl();if(!el||normalScrollHintShown)return;
    if(!el.contains(e.target))return;
    if(e.ctrlKey||e.metaKey)return;
    // Only show once per session
    normalScrollHintShown=true;
    const h=hint();
    if(h){h.textContent='Ctrl + Scroll でズーム';h.style.opacity='1';clearTimeout(hintTimer);hintTimer=setTimeout(()=>{h.style.opacity='0'},2500)}
  },{passive:true});
})();
</script>
